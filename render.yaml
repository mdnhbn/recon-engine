services:
  - type: web
    name: recon-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: recon-engine-db
          property: connectionString

databases:
  - name: recon-engine-db
    plan: free

